name: Deploy k8s
 
on:
  push:
    branches: [main]
 
jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml
 
  build: 
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
    # експортируем переменную
      image_sha: ${{ steps.build-push.outputs.image_sha }}
      backend_image: ${{ steps.build-push.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        run: docker login -u ${{ vars.DOCKER_USER }} -p ${{ secrets.DOCKER_PASS }}

      - name: Build and push frontend and backend images
        id: build-push
        env:
          IMAGE_SHA: sha-${{ github.sha }}
          IMAGE_LATEST: latest
        run: |
          docker build \
          --build-arg BUILD_MODE=${{ vars.BUILD_MODE }} \
          --build-arg VITE_NAME=${{ vars.VITE_NAME }} \
          -t ${{ vars.DOCKER_USER }}/lessons-todo-front:${IMAGE_SHA} \
          -t ${{ vars.DOCKER_USER }}/lessons-todo-front:${IMAGE_LATEST} \
          ./frontend

          docker build \
          -t ${{ vars.DOCKER_USER }}/lessons-todo-back:${IMAGE_SHA} \
          -t ${{ vars.DOCKER_USER }}/lessons-todo-back:${IMAGE_LATEST} \
          ./backend

          docker push ${{ vars.DOCKER_USER }}/lessons-todo-front:${IMAGE_SHA}
          docker push ${{ vars.DOCKER_USER }}/lessons-todo-front:${IMAGE_LATEST}
          docker push ${{ vars.DOCKER_USER }}/lessons-todo-back:${IMAGE_SHA}
          docker push ${{ vars.DOCKER_USER }}/lessons-todo-back:${IMAGE_LATEST}
          # Передаём SHA образов в output, чтобы не дублировать в deploy
          echo "image_sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          # Полное имя образа с тегом — его ждёт deploy-argocd
          echo "backend_image=${{ vars.DOCKER_USER }}/lessons-todo-back:${IMAGE_SHA}" >> "$GITHUB_OUTPUT"


  # deploy:
  #   needs: [build]
  #   runs-on: ubuntu-latest
 
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Configure kubectl
  #       env:
  #         KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
  #       run: |
  #         mkdir -p ~/.kube
  #         echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
 
  #     # - name: Deploy to k3s
  #     #   env:
  #     #     IMAGE: ${{ vars.DOCKER_USER }}/lessons-todo-back:${{ needs.build.outputs.image_sha }}
  #     #   run: |
  #     #     envsubst < manifests/backend.yaml | kubectl apply -f -
  #     #     kubectl annotate deployment/backend-api kubernetes.io/change-cause="sha-${{ github.sha }}" --overwrite
  #     #     kubectl rollout status deployment/backend-api --timeout=120s

  #     - name: Install Helm
  #       uses: azure/setup-helm@v4
  
  #     - name: Deploy with Helm
  #       env:
  #         IMAGE_TAG: ${{ vars.DOCKER_USER }}/lessons-todo-back:${{ needs.build.outputs.image_sha }}
  #       run: |
  #         helm upgrade backend-api ./helm/backend-api \
  #           --reuse-values \
  #           --set image.name="$IMAGE_TAG" \
  #           --wait \
  #           --timeout 4m

  deploy:
    needs: [build]
    uses: ./.github/workflows/deploy-argocd.yml
    with:
      helm_path: helm-charts/backend-api/values-production.yaml
      image_name: ${{ needs.build.outputs.backend_image }}
      branch: main
      gitops_repo: fenix4088/argocd-devops
      argocd_app_name: backend-api
      argocd_server: ${{ vars.ARGOCD_SERVER }}
    secrets:
      gitops_token: ${{ secrets.GITOPS_TOKEN }}
      argocd_auth_token: ${{ secrets.ARGOCD_AUTH_TOKEN }}


  notify:
    if: always()
    needs: [checks, deploy, build]
    uses: ./.github/workflows/notify.yml
    with:
      checks_status: ${{ needs.checks.result }}
      deploy_status: ${{ needs.deploy.result }}
      backend_result: ${{ needs.checks.outputs.backend_result }}
      test_result: ${{ needs.checks.outputs.test_result }}
      frontend_result: ${{ needs.checks.outputs.frontend_result }}
    secrets: inherit